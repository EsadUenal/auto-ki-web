# ENFAL Frontend — nginx-Konfiguration für statisches SPA-Hosting auf Railway.
# Wird beim Container-Start per envsubst nach /etc/nginx/conf.d/default.conf
# gerendert (nur $PORT wird ersetzt, alle anderen $-Variablen sind natives nginx).

# HTML-Dokumente (Startseite, vorgerenderte Seiten, App-Shell) nie aus dem
# Cache — sonst verweisen sie nach einem Deploy auf nicht mehr vorhandene,
# gehashte Assets. `expires` statt `add_header`, weil ein add_header in einer
# location die server-weiten Security-Header dort ausser Kraft setzen wuerde.
map $sent_http_content_type $enfal_html_expires {
    default      off;
    ~^text/html  epoch;
}

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security-Headers — Railway terminiert TLS, HSTS ist hier trotzdem sinnvoll
    # (wird bei jeder Antwort mitgeschickt, auch wenn ein Proxy davor sitzt).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # COOP: geprüft — kein window.open() im Code, Stripe-Checkout läuft als
    # Full-Page-Redirect, externe Links nutzen bereits rel="noopener noreferrer".
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CORP: same-origin ist hier sicher (nur eigene Statics betroffen) — im
    # Gegensatz zum Backend, das E-Book-PDFs per Cross-Origin-fetch() ausliefert
    # und same-origin/same-site dabei blockieren würde (siehe Backend-Kommentar).
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Cross-Origin-Embedder-Policy bewusst NICHT gesetzt: würde jeden
    # Cross-Origin-fetch() zum Backend (Chat/Auth/Käufe, credentials:'include')
    # blockieren, sofern das Backend nicht ebenfalls einen passenden CORP-
    # Header setzt — kein technischer Nutzen (kein SharedArrayBuffer/WASM)
    # gegen dieses Bruchrisiko.
    # Content-Security-Policy bewusst NICHT aktiviert — siehe
    # DEPLOYMENT_REPORT.md (Backend-Repo) für einen dokumentierten Vorschlag.

    expires $enfal_html_expires;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # index.html selbst NIE cachen — sonst laden Nutzer nach einem Deploy ein
    # altes JS-Bundle-Manifest und bekommen 404 auf gehashte Chunk-Dateien.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Gehashte Build-Assets (Vite hängt den Content-Hash an den Dateinamen) —
    # unbedenklich langfristig cachebar, da sich der Dateiname bei Änderung ändert.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Routing (SEO, siehe SEO.md):
    #  - Öffentliche Seiten sind beim Build vorgerendert: /pricing -> /pricing/index.html
    #    (indexierbar, Canonical auf https://getenfal.de/pricing).
    #  - Alle übrigen Pfade (App, Login, Legal, unbekannte URLs) bekommen die
    #    App-Shell spa.html mit noindex. BrowserRouter übernimmt clientseitig;
    #    ein Direktaufruf/Reload liefert so nie einen Server-404.
    location / {
        try_files $uri $uri/index.html /spa.html;
    }

    # Healthcheck-Endpoint für Railway/Docker HEALTHCHECK — vermeidet unnötige
    # Treffer auf index.html-Logs und ist unabhängig vom SPA-Router.
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
