# ENFAL Frontend — nginx-Konfiguration für statisches SPA-Hosting auf Railway.
# Wird beim Container-Start per envsubst nach /etc/nginx/conf.d/default.conf
# gerendert (nur $PORT wird ersetzt, alle anderen $-Variablen sind natives nginx).
#
# Security-Header: nginx-security-headers.conf (-> /etc/nginx/snippets/).
# Jede location mit eigenem add_header MUSS die Datei erneut einbinden, weil
# nginx add_header sonst nicht vererbt. Deshalb gibt es hier nur EINE solche
# location (/assets/); Cache-Steuerung für HTML läuft über `expires`, das die
# Vererbung nicht bricht.

# HTML-Dokumente (Startseite, vorgerenderte Seiten, App-Shell) nie ungeprüft aus
# dem Cache — sonst verweisen sie nach einem Deploy auf nicht mehr vorhandene,
# gehashte Assets. `expires epoch` = "Cache-Control: no-cache".
map $sent_http_content_type $enfal_html_expires {
    default      off;
    ~^text/html  epoch;
}

# Domain-Trennung (Zwischenlösung, siehe DEPLOYMENT.md im Backend-Repo):
# getenfal.de und app.getenfal.de liefern denselben Build aus. Nur getenfal.de
# wird indexiert; die App-Subdomain bekommt X-Robots-Tag noindex. Railway reicht
# den Original-Host als X-Forwarded-Host durch; fehlt er, gilt $host.
# Schlimmstenfalls (falscher Host) fehlt nur der noindex-Header — die
# Canonicals zeigen ohnehin auf getenfal.de.
map $http_x_forwarded_host $enfal_host {
    ""       $host;
    default  $http_x_forwarded_host;
}
map $enfal_host $enfal_robots {
    ~*^app\.                "noindex, nofollow";
    # Railway-eigene Dienstadressen (*.up.railway.app) sind reine Technik-/
    # Vorschauadressen und duerfen nie neben getenfal.de im Index landen.
    ~*\.up\.railway\.app$   "noindex, nofollow";
    default                 "";
}

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/enfal-security-headers.conf;

    expires $enfal_html_expires;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Gehashte Build-Assets (Vite hängt den Content-Hash an den Dateinamen) —
    # unbedenklich langfristig cachebar, da sich der Dateiname bei Änderung ändert.
    location /assets/ {
        include /etc/nginx/snippets/enfal-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Routing (SEO, siehe SEO.md):
    #  - Öffentliche Seiten sind beim Build vorgerendert: /pricing -> /pricing/index.html
    #    (indexierbar, Canonical auf https://getenfal.de/pricing).
    #  - Alle übrigen Pfade (App, Login, Legal, unbekannte URLs) bekommen die
    #    App-Shell spa.html mit noindex. BrowserRouter übernimmt clientseitig;
    #    ein Direktaufruf/Reload liefert so nie einen Server-404.
    location / {
        try_files $uri $uri/index.html /spa.html;
    }

    # Healthcheck-Endpoint für Railway/Docker HEALTHCHECK — vermeidet unnötige
    # Treffer auf index.html-Logs und ist unabhängig vom SPA-Router.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
