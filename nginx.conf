# Vira Frontend — nginx-Konfiguration für statisches SPA-Hosting auf Railway.
# Wird beim Container-Start per envsubst nach /etc/nginx/conf.d/default.conf
# gerendert (nur $PORT wird ersetzt, alle anderen $-Variablen sind natives nginx).

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security-Headers — Railway terminiert TLS, HSTS ist hier trotzdem sinnvoll
    # (wird bei jeder Antwort mitgeschickt, auch wenn ein Proxy davor sitzt).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # index.html selbst NIE cachen — sonst laden Nutzer nach einem Deploy ein
    # altes JS-Bundle-Manifest und bekommen 404 auf gehashte Chunk-Dateien.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Gehashte Build-Assets (Vite hängt den Content-Hash an den Dateinamen) —
    # unbedenklich langfristig cachebar, da sich der Dateiname bei Änderung ändert.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA-Fallback: BrowserRouter braucht clientseitiges Routing — ein Direktaufruf
    # oder Reload auf z.B. /agb oder /datenschutz muss trotzdem index.html liefern,
    # sonst liefert nginx dafür einen 404 (keine solche Datei existiert im Bundle).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck-Endpoint für Railway/Docker HEALTHCHECK — vermeidet unnötige
    # Treffer auf index.html-Logs und ist unabhängig vom SPA-Router.
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
