# ENFAL Frontend — Security-Header (EINE Quelle).
#
# nginx vererbt add_header NICHT: sobald eine location ein eigenes add_header
# setzt, gelten dort die server-weiten Header nicht mehr. Deshalb stehen die
# Header hier und werden im server-Block UND in jeder location mit eigenem
# add_header per include eingebunden (siehe nginx.conf).
#
# Railway terminiert TLS; HSTS wird trotzdem mitgeschickt (jede Antwort).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
# COOP: geprüft — kein window.open() im Code, Stripe-Checkout läuft als
# Full-Page-Redirect, externe Links nutzen bereits rel="noopener noreferrer".
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CORP: same-origin ist hier sicher (nur eigene Statics betroffen) — im
# Gegensatz zum Backend, das E-Book-PDFs per Cross-Origin-fetch() ausliefert
# und same-origin/same-site dabei blockieren würde (siehe Backend-Kommentar).
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Cross-Origin-Embedder-Policy bewusst NICHT gesetzt: würde jeden
# Cross-Origin-fetch() zum Backend (Chat/Auth/Käufe, credentials:'include')
# blockieren, sofern das Backend nicht ebenfalls einen passenden CORP-
# Header setzt — kein technischer Nutzen (kein SharedArrayBuffer/WASM)
# gegen dieses Bruchrisiko.
# Content-Security-Policy bewusst NICHT aktiviert — siehe
# DEPLOYMENT_REPORT.md (Backend-Repo) für einen dokumentierten Vorschlag.

# App-Subdomain nicht indexieren (Wert aus nginx.conf-map; leer = kein Header).
add_header X-Robots-Tag $enfal_robots always;
